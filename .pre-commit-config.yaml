exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "ui_styles.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                ui_styles/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                ui_styles/templates/includes/.*|
                ui_styles/public/js/lib/.*
            )$

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: node
        entry: eslint
        types_or: [javascript]
        args: ["--quiet"]
        additional_dependencies:
          - "eslint@10"
          - "@eslint/js"
          - "globals"
        exclude: |
          (?x)^(
              .*node_modules.*|
              ui_styles/public/dist/.*
          )$

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
